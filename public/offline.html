<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0A0A0A" />
    <title>Offline · PRform</title>
    <!--
      Deliberately plain HTML with inline styles and no build-time dependency.
      This page has to render when the network is gone, which means it cannot
      reference a hashed stylesheet that may not be in the cache. It also shows
      nothing personal — see the note at the top of sw.js about why no
      personalized page is ever cached.

      The type ramp and the flat monochrome match the design system by hand:
      no border radius, no shadows, Geist if it happens to be installed and a
      system stack otherwise.
    -->
    <style>
      :root {
        color-scheme: light dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #ffffff;
        color: #0a0a0a;
        font-family: Geist, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #1a1a1a;
          color: #f5f5f5;
        }
        .card {
          border-color: #333 !important;
        }
        .muted {
          color: #a0a0a0 !important;
        }
      }
      .card {
        border: 1px solid #e5e5e5;
        max-width: 420px;
        width: 100%;
        padding: 32px;
      }
      .wordmark {
        font-weight: 900;
        font-size: 20px;
        text-transform: uppercase;
        letter-spacing: -0.02em;
        margin: 0 0 28px;
      }
      .wordmark span {
        background: #0a0a0a;
        color: #e8ff00;
        padding: 0 4px;
      }
      .label {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.3em;
        color: #6b6b6b;
        margin: 0 0 8px;
      }
      h1 {
        font-weight: 900;
        font-size: 30px;
        text-transform: uppercase;
        margin: 0 0 12px;
        line-height: 1.05;
      }
      .muted {
        color: #6b6b6b;
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
        font-size: 13px;
        line-height: 1.6;
        margin: 0 0 24px;
      }
      button {
        appearance: none;
        width: 100%;
        border: 1px solid #0a0a0a;
        background: #0a0a0a;
        color: #ffffff;
        font-family: inherit;
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        padding: 14px;
        cursor: pointer;
      }
      @media (prefers-color-scheme: dark) {
        button {
          border-color: #f5f5f5;
          background: #f5f5f5;
          color: #0a0a0a;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <p class="wordmark">PR<span>form</span></p>
      <p class="label">No connection</p>
      <h1>You&rsquo;re offline</h1>
      <p class="muted">
        Reconnect and PRform will pick up where you left off.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
